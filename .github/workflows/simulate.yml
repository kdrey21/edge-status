name: Daily Simulation

on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:

jobs:
  simulate:
    name: Run Monte Carlo sim → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write → commit the auto-generated parlay image back to the repo.
    # actions:  write → trigger the deploy workflow so the new image gets served
    #                   (a GITHUB_TOKEN commit does NOT auto-trigger workflows).
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run simulation
        run: npx tsx scripts/simulate.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KALSHI_API_TOKEN: ${{ secrets.KALSHI_API_TOKEN }}

      - name: Commit new parlay-of-the-month image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/parlay-archive/
          if git diff --cached --quiet; then
            echo "No new parlay image to commit."
          else
            git commit -m "chore: archive parlay of the month image"
            git push
            gh workflow run deploy-pages.yml
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
